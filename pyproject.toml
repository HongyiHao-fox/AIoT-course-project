[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "blindnav"
version = "0.1.0"
description = "Wearable navigation aid for blind users: obstacles, walkable path, signboards and traffic lights."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "torch>=2.2",
    "torchvision>=0.17",
    "accelerate>=0.26",
    "ultralytics>=8.4.0",
    "transformers>=4.57.0",
]

[project.optional-dependencies]
server = ["flask>=3.0"]
chat = ["openai>=1.0"]
dev = ["pytest>=8.0", "ruff>=0.5"]
all = ["blindnav[server,chat,dev]"]

[project.scripts]
blindnav = "blindnav.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
blindnav = ["server/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
